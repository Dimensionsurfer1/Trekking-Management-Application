{% extends 'TMA_base.html' %}

{% block content %}
<div class="nature_background">
    <div class="form-container">
        <h2>Join Alpine Path</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p style="color: red; font-size: 0.9rem;">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/signup" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email_id" placeholder="Email Address" required>
            <input type="text" name="contact_details" placeholder="Phone Number" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <select name="role" required>
                <option value="" disabled selected>Select your role...</option>
                <option value="Trekker">Trekker (Book Treks)</option>
                <option value="Staff">Trek Staff (Guide Treks)</option>
            </select>
            
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>
        
        <p>Already have an account? <a href="/login">Log in here</a></p>
        <a href="/" class="back-link">Back to Home</a>
    </div>
</div>
{% endblock %}
